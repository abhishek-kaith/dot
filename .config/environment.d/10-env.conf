# Environment for the whole desktop session (see environment.d(5)).
# Applies to everything started by KDE/GNOME: apps, KeePassXC, terminals, AI
# agents. Takes effect after logging out and back in.

PATH=${HOME}/.local/bin:${HOME}/.local/share/mise/shims:${PATH}
EDITOR=nvim
VISUAL=nvim

# The agent behind ssh-agent.socket (systemctl --user enable ssh-agent.socket).
# KeePassXC loads keys into it while the database is unlocked.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket

# Rootless podman's Docker-compatible API (systemctl --user enable podman.socket),
# for docker-compose, lazydocker, testcontainers and friends.
DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock
