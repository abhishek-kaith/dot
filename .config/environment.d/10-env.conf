# Environment for the whole desktop session (see environment.d(5)).
# Applies to everything the desktop starts (niri, GNOME): apps, terminals, AI agents.
# Takes effect after logging out and back in.

PATH=${HOME}/.local/bin:${HOME}/.local/share/mise/shims:${PATH}
EDITOR=nvim
VISUAL=nvim

# Bitwarden desktop's SSH agent (Settings > SSH agent). Keys stay in the vault;
# Bitwarden asks before each use and only works while it is running and unlocked.
SSH_AUTH_SOCK=${HOME}/.bitwarden-ssh-agent.sock

# Rootless podman's Docker-compatible API (systemctl --user enable podman.socket),
# for docker-compose, lazydocker, testcontainers and friends.
DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock

# Dev tools that drive a browser use the system Chromium (pacman keeps it updated).
CHROME_PATH=/usr/bin/chromium
CHROME_BIN=/usr/bin/chromium
PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
PUPPETEER_SKIP_DOWNLOAD=true
# Playwright MCP (AI agents). Playwright's test runner still uses its own
# pinned browser: npx playwright install chromium
PLAYWRIGHT_MCP_EXECUTABLE_PATH=/usr/bin/chromium
