# Microphone noise suppression (RNNoise, from noise-suppression-for-voice).
# Creates a virtual "Noise Canceling Source": pick it as the default input in
# the volume applet. Apply: systemctl --user restart pipewire (or re-login).
# Keyboard clicks get through? Raise "VAD Threshold". Quiet words cut? Lower it.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Noise Canceling Source"
      media.name = "Noise Canceling Source"
      filter.graph = {
        nodes = [
          {
            type = ladspa
            name = rnnoise
            plugin = librnnoise_ladspa
            label = noise_suppressor_mono
            control = {
              "VAD Threshold (%)" = 50.0
              "VAD Grace Period (ms)" = 200
              "Retroactive VAD Grace (ms)" = 0
            }
          }
        ]
      }
      capture.props = {
        node.name = "capture.rnnoise_source"
        node.passive = true
        audio.rate = 48000
      }
      playback.props = {
        node.name = "rnnoise_source"
        media.class = "Audio/Source"
        audio.rate = 48000
      }
    }
  }
]
