# Noctalia 5.4.1 (Arch extra). Hand-written settings, tracked in the dotfiles.
# Changes made in the Settings window go to ~/.local/state/noctalia/settings.toml
# instead (not tracked) and win over this file; copy keepers back here.
# Check after editing: noctalia config validate
# Every default, with comments: /usr/share/doc/noctalia or github.com/noctalia-dev/noctalia/blob/v5.4.1/example.toml

[shell]
font_family = "Inter"
corner_radius_scale = 0.5            # 0 square ... 1 default; matches the square windows
polkit_agent = true                  # password prompts for pacman GUIs, disks, etc.
niri_overview_type_to_launch_enabled = true   # type in niri's overview to search apps
# Apps started from the launcher, dock or taskbar run as their own systemd services:
# systemd-oomd then kills only the app using too much memory, and restarting
# Noctalia doesn't close them. Needs noctalia.service (it is).
launch_apps_as_systemd_services = true

# Spotlight-like: just the search box and results (no avatar, power or gear).
# Login screen (noctalia-greeter) follows the wallpaper, colors and font
# whenever they change. Avatar: ~/.face, via AccountsService.
[shell.greeter_sync]
auto_sync = true

[shell.launcher]
layout = "simple"
category_icons_only = true           # the simple layout is 560 px wide: labels didn't fit
show_settings_button = false
show_session_button = false
pinned = ["ghostty", "app.zen_browser.zen", "org.gnome.Nautilus"]

# ── Look: colors from the wallpaper ─────────────────────────────────────────

[theme]
mode = "dark"
source = "wallpaper"                 # builtin | wallpaper | community
wallpaper_scheme = "m3-content"      # m3-tonal-spot | m3-content | vibrant | faithful | muted | ...
pure_black_dark = true               # true black background

[theme.templates]
# Recolored on every wallpaper change. Ghostty uses the user template below,
# so Noctalia never edits the tracked ghostty config.
builtin_ids = ["niri", "gtk3", "gtk4", "qt", "btop"]
enable_community_templates = false

[theme.templates.user.ghostty-colors]
input_path = "templates/ghostty-colors"
output_path = "~/.config/ghostty/noctalia-colors"   # read via `config-file = ?noctalia-colors`
post_hook = "bash /usr/share/noctalia/assets/templates/ghostty/reload.sh"

# Dark and light wallpapers: one folder each (not tracked), with a nature default
# downloaded by install.sh niri. Switching dark/light (control center's Dark Mode,
# or `noctalia msg theme-mode-toggle`) swaps the wallpaper too, through the hook
# below; the one you pick in each mode is remembered (~/.local/bin/wallpaper-mode).
# Add your own images to the folders; pick one with the launcher's /wall.
[wallpaper]
directory = "~/Pictures/Wallpapers"
directory_dark = "~/Pictures/Wallpapers/Dark"
directory_light = "~/Pictures/Wallpapers/Light"
fill_mode = "crop"
transition = ["fade", "disc", "wipe"]
transition_duration = 700            # ms (default 1500)

[wallpaper.default]
path = "~/Pictures/Wallpapers/Dark/wallhaven-5y3q31.jpg"

[hooks]
theme_mode_changed = "wallpaper-mode"

# niri's overview shows the wallpaper blurred behind the workspaces
# (with the place-within-backdrop layer rule in ~/.config/niri/config.kdl).
[backdrop]
enabled = true
blur_intensity = 0.6
tint_intensity = 0.25

# No plugins in use: don't keep fetching the plugin catalogues (git) in the
# background (that stalled the shell for ~18 s once). Settings > Plugins still
# works; update a source there by hand.
[plugins]
enabled = []
auto_update = "none"

[shell.animation]
speed = 1.4                          # UI animations 40% faster (1.0 = default)

[shell.panel]
transparency_mode = "soft"           # solid | soft | glass

# ── Bar: thin, translucent and blurred, full width along the top ────────────
# GNOME/macOS layout: workspaces + app on the left, date and time in the middle,
# icon-only status on the right (click one: its page in the control center).
# Control center: Mod+S. Settings: Mod+Shift+Comma. Power menu: Mod+Shift+E.

[bar.main]
position = "top"
thickness = 28
radius = 0
margin_ends = 0
margin_edge = 0
padding = 8
widget_spacing = 6
background_opacity = 0.72            # see-through, so niri can blur behind it
compositor_blur = true
shadow = false
capsule = false
start = ["workspaces", "app"]
center = ["clock"]
end = ["media", "tray", "notifications", "wifi", "bluetooth", "volume", "brightness", "battery"]

# Square workspace buttons with their number; the active one is filled.
[widget.workspaces]
type = "workspaces"
style = "regular"
show_labels = true
show_icons = false
active_pill_size = 1.0
inactive_pill_size = 1.0
capsule_radius = 3.0

[widget.app]
type = "active_window"
display = "icon_and_text"
max_length = 360                     # pixels, not characters

[widget.clock]
type = "clock"
format = "{:%a %d %b  %H:%M}"        # Tue 11 Nov  14:05

[widget.media]
type = "media"
hide_when_no_media = true
hide_album_art = true
max_length = 40

[widget.wifi]
type = "network"
show_label = false

[widget.bluetooth]
type = "bluetooth"
show_label = false
hide_when_adapter_off = true

[widget.volume]
type = "volume"
show_label = false

[widget.brightness]
type = "brightness"
show_label = false

# Battery: icon + percent. The 90% limit: control center > Power > Battery
# charging (built into Noctalia; UPower).
[widget.battery]
type = "battery"
display_mode = "glyph"               # same size as the other icons
show_label = true
label_content = "percent"

# Control center (Mod+S / Mod+A) home buttons, 6 at most. Wi-Fi and Bluetooth
# are on the bar already. Caffeine = never sleep / lock until turned off.
[control_center]
show_shortcut_labels = true

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "mic_mute"

# ── Night Light: warmer screen in the evening ───────────────────────────────
# Fixed times (no location lookup); the change fades over an hour around each.
# Control center button: on/off; right-click it: warm all the time.
[nightlight]
enabled = true
temperature_night = 4000             # Kelvin; lower = warmer

[location]
auto_locate = false
custom_schedule = true
sunset = "19:30"
sunrise = "07:00"

# ── Lock and idle (both off by default in Noctalia) ─────────────────────────

[idle.behavior.lock]
enabled = true
timeout = 600                        # lock after 10 min idle
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 660                        # screen off a minute later
action = "screen_off"

# Suspend after 30 min idle, on battery only (plugged in it stays awake).
# Locks first (lockscreen.lock_before_suspend). Caffeine in the control
# center, and apps playing video, hold all of these off.
[idle.behavior.suspend-on-battery]
enabled = true
timeout = 1800
action = "command"
command = '''sh -c 'for p in /sys/class/power_supply/*; do [ "$(cat "$p/type")" = Mains ] && [ "$(cat "$p/online")" = 1 ] && exit 0; done; systemctl suspend''''
