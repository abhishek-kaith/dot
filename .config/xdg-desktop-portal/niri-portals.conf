# niri's portal choices (copy of /usr/share/xdg-desktop-portal/niri-portals.conf)
# with one change: file open/save dialogs from the GTK portal. The GNOME one
# starts Nautilus behind every dialog, which makes them slow to appear.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
