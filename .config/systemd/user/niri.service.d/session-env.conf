# Environment for the niri session only. Set in the systemd user manager while
# niri runs, so Noctalia and the apps it starts (systemd services) get it too;
# removed again when niri stops, so another desktop's login doesn't inherit it.
# Keep in sync with `environment` and `cursor` in ~/.config/niri/config.kdl.
[Service]
ExecStartPost=/usr/bin/systemctl --user set-environment QT_QPA_PLATFORMTHEME=qt6ct XCURSOR_THEME=Adwaita XCURSOR_SIZE=24
ExecStopPost=/usr/bin/systemctl --user unset-environment QT_QPA_PLATFORMTHEME XCURSOR_THEME XCURSOR_SIZE
