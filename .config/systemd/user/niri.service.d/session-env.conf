# niri-session-only env for Noctalia and its apps; removed when niri stops.
# Keep in sync with `environment` and `cursor` in niri's config.
[Service]
ExecStartPost=/usr/bin/systemctl --user set-environment QT_QPA_PLATFORMTHEME=qt6ct XCURSOR_THEME=Adwaita XCURSOR_SIZE=24
ExecStopPost=/usr/bin/systemctl --user unset-environment QT_QPA_PLATFORMTHEME XCURSOR_THEME XCURSOR_SIZE
