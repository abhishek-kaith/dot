# tmux: reload with prefix + r

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
# Ghostty: truecolour, OSC 52 clipboard, focus events, extended keys
set -as terminal-features ",xterm-ghostty:RGB:clipboard:focus:extkeys"
set -s extended-keys on
set -s set-clipboard on
set -g focus-events on
set -s escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g mouse on
set -g set-titles on
set -g set-titles-string "tmux - #W"

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind f run-shell "tmux neww tmux-sessionizer"
bind -r m resize-pane -Z

# copy mode: vi keys
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# panes: hjkl to move, HJKL to resize
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r H resize-pane -L 2
bind -r L resize-pane -R 2
bind -r K resize-pane -U 2
bind -r J resize-pane -D 2

# new splits/windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
