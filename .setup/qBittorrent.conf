; qBittorrent starting config. install.sh copies it to
; ~/.config/qBittorrent/qBittorrent.conf only if that file doesn't exist yet
; (qBittorrent rewrites its config on exit, so it isn't tracked live).
; Port 51413 is allowed in ufw by install.sh. Everything else here is already
; qBittorrent's default; listed so the setup is visible in one place.

[BitTorrent]
Session\Port=51413
Session\BTProtocol=Both
Session\DHTEnabled=true
Session\PeXEnabled=true
Session\LSDEnabled=true
Session\Encryption=0
Session\MaxConnections=500
Session\MaxConnectionsPerTorrent=100

[Network]
PortForwardingEnabled=true

[Preferences]
WebUI\Enabled=false
